apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-routing
  namespace: iot-namespace
spec:
  ingressClassName: traefik
  rules:

  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wil-42-v1-service
            port:
              number: 8888
      - path: /v2
        pathType: Prefix
        backend:
          service:
            name: wil-42-v2-service
            port:
              number: 8888



